# 代码格式：pyink 26.5.1，在仓库根目录运行 `pyink .`
# 不设 exclude：设了 exclude，pyink 就不读 .gitignore
[tool.pyink]
line-length = 80
pyink-indentation = 2
pyink-use-majority-quotes = true
# 只格式化根目录与下列顶层目录里的 .py；其他顶层目录（例如本机另放的仓库）不碰，新增含代码的顶层目录时加进来
include = '^/((\.github|mod|profiling|Script|tests|tools)/.*)?[^/]+\.pyi?$'
# config_def.py 由 buildconfig.py 生成
force-exclude = '^/Script/Config/config_def\.py$'

# 棘轮对每个模块都按下面这一套参数运行 mypy。
# mypy 也检查没有类型标注的函数的函数体。
# 它还报出执行不到的代码、可能未赋值就用到的名字、永远不成立的比较、多余的 cast，以及没用上或没写错误码的 `# type: ignore`。
# 这一套不要求函数写类型标注。
# mypy 推断不出一个变量的类型时，仍要求给这个变量写类型标注。
[tool.mypy]
explicit_package_bases = true
follow_imports = "silent"
# 编辑器 tools/ArkEditor 以自己的目录为脚本目录运行，按顶层模块名导入同目录的模块（如 cache_control、ui.window）
# tests/education 的脚本按顶层模块名导入 _bootstrap 与 official_event_check，tests/_mypy_stubs 的存根把这两个名字指到真实模块
# tools/MCP/prts_character_downloader 的脚本按顶层模块名导入同目录的 downloader 与 server，tools/backup/rename_and_organize_images.py 把 tools 目录加进 sys.path 后导入 download_prts_character_image，tests/_mypy_stubs 里同名的存根也把这三个名字指到真实模块
# tests/fast/arkeditor_file_load_driver.py 作为脚本运行，按顶层模块名导入 arkeditor_effect_menu_driver。tests/fast/arkeditor_entry_edit_driver.py 作为脚本运行，按顶层模块名导入 arkeditor_file_load_driver。tests/_mypy_stubs 里同名的存根让 mypy 把这两个名字解析到 tests/fast 里的真实模块。
# tools/test_quality 的脚本也以自己的目录为脚本目录运行，按顶层模块名导入同目录的 data_check、fast_suite 与 checkout_fixture
# tools/verify 的 tk.py、tk_game.py、arkeditor.py、test_limited_run.py、test_tk_game.py 与 test_arkeditor.py 把自己的目录加进 sys.path，再按顶层模块名导入同目录的模块。被这样导入的模块是 limited_run、tk、tk_game 与 arkeditor。tests/_mypy_stubs 里同名的存根把这四个名字指到真实模块。
mypy_path = ["tools/ArkEditor", "tools/test_quality", "tests/_mypy_stubs"]
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
extra_checks = true
warn_unreachable = true
enable_error_code = ["possibly-undefined", "ignore-without-code", "deprecated", "redundant-self", "truthy-iterable"]

# rtmlib 不带类型信息，也没有类型存根包。
# 这一项让 mypy 不报 rtmlib 缺类型。
[[tool.mypy.overrides]]
module = ["rtmlib"]
ignore_missing_imports = true

# tools/test_quality 的脚本导入的 lint 包是可选的本机 lint 引擎，不随仓库提供（见 CONTRIBUTING.md），mypy 找不到它
[[tool.mypy.overrides]]
module = ["lint", "lint.rules"]
ignore_missing_imports = true

# 可选的本机 lint 引擎做棘轮检查时读这张表。
# 这个引擎不随仓库提供。
# 启用方法见 CONTRIBUTING.md。
# exclude 里的文件不参与棘轮检查。
# 模块行数超过 soft 时给警告。
# 模块行数超过 hard 时算违规。
# 下面每张 [tool.lint-ratchet.checkers.*] 表写一个检查工具，以及棘轮运行它的命令。
[tool.lint-ratchet]
baseline = ".lint-baseline.tsv"
exclude = ["Script/Config/config_def.py"]
soft = 300
hard = 400
# 棘轮运行 ruff 时带 `--ignore-noqa`，所以 `# noqa` 注释压不下棘轮报出的问题。
# 因此这里不禁止 `# noqa` 注释。
ban_noqa = false

# 棘轮和手动运行的 `ruff check` 都用装了 requirements-dev.txt 的环境里的 ruff。
# `.lint-baseline.tsv` 开头的 `# fingerprint` 行记着算基线时用的 ruff 版本。
# 装的 ruff 与这个版本不同时，棘轮不要求重算基线。
# 这时棘轮用装的 ruff 把合并基点也查一遍，再拦下这次改动新增的问题。
# 所以 requirements-dev.txt 和这张表的 requires 都不固定 ruff 的版本。
[tool.lint-ratchet.checkers.ruff]
requires = ["ruff"]
argv = ["ruff", "check", "--config=pyproject.toml", "--no-cache", "--ignore-noqa", "--output-format=json", "{files}"]
json = { path = "filename", line = "location.row", rule = "code", message = "message" }
per_file = true
measure = { E501 = "max:max" }
rules_argv = ["ruff", "check", "--config=pyproject.toml", "--show-settings", "{files}"]
rules_format = '^\t\S+ \((?P<rule>[A-Z]+[0-9]+)\),$'
reads = ["pyproject.toml:tool.ruff"]

[tool.lint-ratchet.checkers.mypy]
requires = ["mypy==2.4.0"]
argv = ["mypy", "--config-file=pyproject.toml", "--explicit-package-bases", "--follow-imports=silent", "--show-error-codes", "--no-error-summary", "--no-pretty", "--hide-error-context", "--cache-dir={cache}", "{files}"]
strict_args = []
format = '^(?P<path>.+?):(?P<line>\d+)(?::\d+)?(?::\d+:\d+)?: error: (?P<message>.*?)(?:  \[(?P<rule>[a-z0-9-]+)\])?$'
reads = ["pyproject.toml:tool.mypy"]
prefix = "mypy:"

[tool.lint-ratchet.checkers.pyink]
requires = ["pyink==26.5.1"]
argv = ["pyink", "--check", "--verbose", "{files}"]
stream = "stderr"
per_file = true
format = '^would (?P<message>reformat) (?P<path>.+)$'
reads = ["pyproject.toml:tool.pyink"]
clean = true

# 在仓库根目录手动运行 `ruff check --ignore-noqa` 时，受 git 跟踪的 .py 文件得到的报告与棘轮运行 ruff 时相同。
# 手动运行时 ruff 自己找要查的文件。
# 它还会查没被 git 跟踪、也没被 .gitignore 忽略的 .py 文件。棘轮不查这些文件。
# include 让 ruff 自己找文件时只收 .py 文件。
# extend-exclude 让 ruff 自己找文件时跳过生成的 Script/Config/config_def.py。
# 棘轮把文件列表直接交给 ruff，所以这两项不改变棘轮查哪些文件。
[tool.ruff]
line-length = 120
indent-width = 2
target-version = "py312"
include = ["*.py"]
extend-exclude = ["Script/Config/config_def.py"]

# 选用下面这些规则组。
# F 是 pyflakes，查没用上的名字和没定义的名字等问题。
# E4、E7 与 E9 是 pycodestyle 对导入、语句、语法错误和读文件错误的检查。
# E501 查行长。
# W 是 pycodestyle 的警告，查行尾空白和无效转义等问题。
# B 是 bugbear，查容易出错的写法。
# PLE 与 PLW 是 pylint 的错误与警告。
# D1 查缺少的文档字符串。
# D419 查空的文档字符串。
# UP 是 pyupgrade，查能换成新写法的旧语法。
# PLW0603 查 global 语句，留到以后再选。
# 去掉 global 语句要改代码结构。
[tool.ruff.lint]
select = ["F", "E4", "E7", "E9", "E501", "W", "B", "PLE", "PLW", "D1", "D419", "UP"]
ignore = ["PLW0603"]

# tools/test_quality/fast_report.py 在快速测试层 tests/fast 上跑的三条测试质量规则；不设阈值，用规则的默认值，报告里列出测到的数和阈值
[tool.test-quality.rules.tests-coverage]
# 与 `python -m unittest discover -s tests/fast -t .` 找测试的方式相同
start_dir = "tests/fast"
top_dir = "."
pattern = "test_*.py"
source = ["Script"]

[tool.test-quality.rules.tests-assertions]
test_globs = ["tests/fast/test_*.py"]

[tool.test-quality.rules.tests-mutation]
# 变异体只拿 tests/fast 来查，不用 tests/slow。查变异体时 subprocess.run 被拦下，
# 所以会启动子进程的测试文件不列进来：它们在不变异时就失败，整套测试一失败，哪个文件都打不了分
test_globs = [
    "tests/fast/test_buildata_tables_ignore_module_docstring.py",
    "tests/fast/test_check_reregister_same_function.py",
    "tests/fast/test_child_stage_names.py",
    "tests/fast/test_child_stages_offline.py",
    "tests/fast/test_clear_cmd_by_number.py",
    "tests/fast/test_climax_line_names_operator.py",
    "tests/fast/test_commission_edit_save.py",
    "tests/fast/test_cup_shrinks_after_lactation_ends.py",
    "tests/fast/test_follower_enters_full_room.py",
    "tests/fast/test_game_clock_passes_checks.py",
    "tests/fast/test_inactive_images_not_loaded.py",
    "tests/fast/test_load_same_for_any_listing_order.py",
    "tests/fast/test_location_dir_names_translate.py",
    "tests/fast/test_locked_room_entry.py",
    "tests/fast/test_locked_room_stays_locked.py",
    "tests/fast/test_mod_load_state.py",
    "tests/fast/test_mod_loader.py",
    "tests/fast/test_offline_bit_self_is_baby.py",
    "tests/fast/test_repair_reregister_same_function.py",
    "tests/fast/test_same_name_image_pick.py",
    "tests/fast/test_static_operator_minor_talents.py",
    "tests/fast/test_trainee_not_child.py",
    "tests/fast/test_unnormal_bits_same_meaning.py",
    "tests/fast/test_world.py",
]
# 这是整套快速测试跑一次的时限，不是单个测试的。世界载入后，上面列出的测试整套跑一次约 1 秒。到时限还没跑完的一次会被停下。没变异的一次被停下时，这个文件不计分。变异后的一次被停下时，这个变异体算被杀掉。10 秒给忙的机器上变慢的运行留出余地
mutant_timeout = 10.0
# 并行查变异体的工作进程数，给同时运行的游戏和其他程序留出 CPU
max_workers = 3
