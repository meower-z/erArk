# 源码读取者清单：代码里把 Python 源码当数据读的地方，每处一行。
# 新增这类代码的 PR 在同一改动里加行；删掉或改名时同样改这里。
#
# [[reader]] 的字段：
#   id        R 加两位以上数字，不重复
#   file      读取代码所在的文件（仓库相对路径）
#   symbol    读取代码所在的函数或类的全名（外层.内层），模块顶层写 "<module>"；不写行号
#   mechanism getsource | ast | tokenize | open+regex | open+bytes | gettext | writer | test-needle | metadata
#   reads     读的是什么
#   used_for  读出来的东西用在哪
#   when      startup | build | dev-tool | test | game-runtime | ci
#   capture   怎样取它的真实输出，好比较改动前后：
#             instruct-registry  载入游戏，取每条指令的大类与面板 id（只用于 R01）
#             command            在检出目录里运行 command，输出是标准输出加上 outputs 里列的文件；
#                                "@diff" 表示运行后整个检出目录的 git diff；command 的第一个词 "python" 指游戏的 venv
#             suite              读取者是测试里的断言，输出就是测试结果，跑测试套件时一起比较
#   compare   exact（默认）| po-messages（去掉 #: 位置行和生成时间）| no-line-numbers（去掉 :行号 与 diff 的行号头）
#   why       compare 不是 exact 时必填：为什么去掉的部分不算输出
#
# [[allow]]：扫描命中了、但不是读取者的地方。字段 file、symbol、pattern（命中的模式名）、why 都必填；
# 一条 allow 若不再对应任何命中，清单就算格式错误，要删掉它。
#
# [[decorator]]：审过的 erArk 装饰器。被它装饰的函数，可以在顶部有 from __future__ import annotations 的模块里改注解。
# 字段 file、symbol（模块顶层函数名；带参数的写法按工厂函数算）、why 都必填。这张表可以没有；
# 没有或为空时，除 staticmethod、classmethod、property、functools.wraps 外，带装饰器的函数都不许改注解。
# 清单里的装饰器自己的定义必须原样不变（按 AST 比较，注解、文档字符串、内层函数都算），
# 它函数体用到的同模块顶层名字也必须不变；同一模块里别的改动，只要是机械规范化就可以。
# 一条 decorator 若不再装饰任何函数，清单就算格式错误。

[[reader]]
id = "R01"
file = "Script/System/Instruct_System/handle_instruct.py"
symbol = "add_instruct.decorator"
mechanism = "getsource"
reads = "没写大类的指令函数的源码"
used_for = "指令大类与面板 id 的登记，Web 指令界面按它分组"
when = "startup"
capture = "instruct-registry"

[[reader]]
id = "R02"
file = "buildata.py"
symbol = "class_indent"
mechanism = "writer"
reads = "constant_promise.py、constant_effect.py 与 handle_premise 包里各模块的第一条缩进行"
used_for = "生成的常量与前提函数照这个缩进写入"
when = "build"
capture = "command"
command = ["python", "-c", '''
import sys, types
stub = types.ModuleType("Script.Config.game_config")
stub.init = lambda: None
sys.modules["Script.Config.game_config"] = stub
import buildata
for path in ["Script/Core/constant_promise.py", "Script/Core/constant_effect.py", *sorted(set("Script/Design/handle_premise/" + m for m in buildata.premise_module_dict.values()))]:
    print(path, repr(buildata.class_indent(path)))
''']
outputs = []

