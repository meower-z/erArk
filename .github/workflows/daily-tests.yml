name: Daily tests

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      test_path:
        description: "Single pytest file or node id under tests/fast/, tests/slow/ or tools/verify/ (for example tests/slow/test_foo.py or tests/slow/test_foo.py::TestCls::test_bar). Leave empty to run the full suites."
        required: false
        default: ""
        type: string
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  typecheck:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_path == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-lint.txt

      - name: Install lint dependencies
        run: python -m pip install -r requirements-lint.txt

      - name: pyrefly against .lint-baseline.tsv
        timeout-minutes: 5
        run: python tools/pyrefly_baseline_check.py

  fast-and-verify:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_path == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            tests/requirements.txt

      - name: Install dependencies
        id: deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r tests/requirements.txt

      - name: Fast suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 15
        run: python -m pytest tests/fast -p no:cacheprovider -rfEs --junitxml=test-reports/fast.xml

      - name: tools/verify unit tests
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 10
        run: python -m pytest tools/verify -p no:cacheprovider -rfEs --junitxml=test-reports/verify.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-fast-verify
          path: test-reports/
          retention-days: 7

  slow:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_path == '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            tests/requirements.txt

      - name: Install dependencies
        id: deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r tests/requirements.txt

      - name: Install window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox

      - name: Download save 99 fixture
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/save99.tar.gz
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$ARCHIVE" https://raw.githubusercontent.com/meower-z/erArk/3e7c263eade7e909d28c1f3499760f28249227e7/save99.tar.gz
          echo "d207f104cfabbe37ff322b1ba9465c13a5496556b1485c57cbbcfe55edb4f7b0  $ARCHIVE" | sha256sum -c -
          mkdir -p save/99
          tar -xzf "$ARCHIVE" -C save/99
          test -f save/99/0
          test -f save/99/1
          rm "$ARCHIVE"

      - name: Slow suite shard ${{ matrix.shard }}
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          listing=$(python tools/ci_slow_shards.py --shard "$SHARD" --total 4)
          mapfile -t FILES <<< "$listing"
          xvfb-run -a sh -c 'openbox & python -m pytest "$@" --forked -k "not EducationSuiteTest" -p no:cacheprovider -rfEs --junitxml="test-reports/slow-shard-$SHARD.xml"' sh "${FILES[@]}"

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-slow-${{ matrix.shard }}
          path: test-reports/
          retention-days: 7

  education:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_path == '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            tests/requirements.txt

      - name: Install dependencies
        id: deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r tests/requirements.txt

      - name: Download save 99 fixture
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/save99.tar.gz
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$ARCHIVE" https://raw.githubusercontent.com/meower-z/erArk/3e7c263eade7e909d28c1f3499760f28249227e7/save99.tar.gz
          echo "d207f104cfabbe37ff322b1ba9465c13a5496556b1485c57cbbcfe55edb4f7b0  $ARCHIVE" | sha256sum -c -
          mkdir -p save/99
          tar -xzf "$ARCHIVE" -C save/99
          test -f save/99/0
          test -f save/99/1
          rm "$ARCHIVE"

      - name: Education suite
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 20
        run: python -m pytest tests/slow --forked -k EducationSuiteTest -p no:cacheprovider -rfEsP --junitxml=test-reports/education.xml

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-education
          path: test-reports/
          retention-days: 7

  targeted:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_path != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            tests/requirements.txt

      - name: Install dependencies
        id: deps
        run: python -m pip install -r requirements.txt -r requirements-dev.txt -r tests/requirements.txt

      - name: Install window manager
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends openbox

      - name: Download save 99 fixture
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        shell: bash
        env:
          ARCHIVE: ${{ runner.temp }}/save99.tar.gz
        run: |
          curl -fsSL --retry 3 --retry-delay 2 -o "$ARCHIVE" https://raw.githubusercontent.com/meower-z/erArk/3e7c263eade7e909d28c1f3499760f28249227e7/save99.tar.gz
          echo "d207f104cfabbe37ff322b1ba9465c13a5496556b1485c57cbbcfe55edb4f7b0  $ARCHIVE" | sha256sum -c -
          mkdir -p save/99
          tar -xzf "$ARCHIVE" -C save/99
          test -f save/99/0
          test -f save/99/1
          rm "$ARCHIVE"

      - name: Targeted test
        if: ${{ !cancelled() && steps.deps.outcome == 'success' }}
        timeout-minutes: 30
        shell: bash
        env:
          TEST_PATH: ${{ inputs.test_path }}
        run: |
          if [[ ! "$TEST_PATH" =~ ^(tests/fast|tests/slow|tools/verify)/[A-Za-z0-9_./:-]+$ ]]; then
            echo "::error::Invalid test_path: must start with tests/fast/, tests/slow/ or tools/verify/ and use only ASCII letters, digits, _, ., /, : and -."
            exit 1
          fi
          if [[ "$TEST_PATH" == *..* ]]; then
            echo "::error::Invalid test_path: the character sequence .. is not allowed."
            exit 1
          fi
          if [[ ! -f "${TEST_PATH%%::*}" ]]; then
            echo "::error::Invalid test_path: the file part of test_path, before any test node id, must be an existing regular file (directories are not accepted)."
            exit 1
          fi
          if [[ "$TEST_PATH" == tests/slow/* ]]; then
            xvfb-run -a sh -c 'openbox & python -m pytest --forked -p no:cacheprovider -rfEs --junitxml=test-reports/targeted.xml -- "$1"' sh "$TEST_PATH"
          else
            xvfb-run -a sh -c 'openbox & python -m pytest -p no:cacheprovider -rfEs --junitxml=test-reports/targeted.xml -- "$1"' sh "$TEST_PATH"
          fi

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-targeted
          path: test-reports/
          retention-days: 7

  tests:
    needs: [fast-and-verify, slow, education, targeted]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Check test jobs
        shell: bash
        env:
          FAST_AND_VERIFY: ${{ needs.fast-and-verify.result }}
          SLOW: ${{ needs.slow.result }}
          EDUCATION: ${{ needs.education.result }}
          TARGETED: ${{ needs.targeted.result }}
        run: |
          ran=0
          for job in FAST_AND_VERIFY SLOW EDUCATION TARGETED; do
            result=${!job}
            echo "$job: $result"
            case "$result" in
              success) ran=1 ;;
              skipped) ;;
              *) echo "::error::Test job $job finished with status $result."; exit 1 ;;
            esac
          done
          if [ "$ran" -eq 0 ]; then
            echo "::error::Every test job was skipped."
            exit 1
          fi
